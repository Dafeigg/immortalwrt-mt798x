name: Build mt798x

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build'
        required: true
        default: 'pplink_s21'
        type: choice
        options:
          - jcg_q30
          - cmcc_rax3000m
          - glinet_gl-mt3000
          - h3c_nx30pro
          - livinet_zr-3020
          - ikuai_q3000
          - xiaomi_mi-router-wr30u
          - xiaomi_mi-router-ax3000t
          - cetron_ct3003
          - abt_asr3000
          - cmcc_a10
          - nradio_wt9103
          - nradio_wt9103_512m
          - pplink_s21
      clean:
        description: 'Clean build (remove staging_dir/toolchain*)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget

      - name: Clone source code and copy custom files
        run: |
          git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git immortalwrt
          cd immortalwrt
          # 确保目标目录存在
          mkdir -p target/linux/mediatek/dts
          mkdir -p target/linux/mediatek/image
          # 复制 DTS 文件（如果存在于当前仓库中）
          if [ -f ${{ github.workspace }}/target/linux/mediatek/dts/mt7981-pplink-s21.dts ]; then
            cp ${{ github.workspace }}/target/linux/mediatek/dts/mt7981-pplink-s21.dts target/linux/mediatek/dts/
            echo "DTS file copied."
          else
            echo "DTS file not found, skipping."
          fi
          # 复制 mt7981.mk（如果存在于当前仓库中）
          if [ -f ${{ github.workspace }}/target/linux/mediatek/image/mt7981.mk ]; then
            cp ${{ github.workspace }}/target/linux/mediatek/image/mt7981.mk target/linux/mediatek/image/
            echo "mt7981.mk copied."
          else
            echo "mt7981.mk not found, skipping."
          fi
          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        run: |
          cd immortalwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_${{ github.event.inputs.device }}=y" >> .config
          make defconfig

      - name: Download packages
        run: |
          cd immortalwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd immortalwrt
          if [ "${{ github.event.inputs.clean }}" = "true" ]; then
            make clean
          fi
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device }}-firmware
          path: immortalwrt/bin/targets/mediatek/mt7981/*.bin
