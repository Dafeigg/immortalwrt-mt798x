name: Build mt798x

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device name (unused but required)'
        required: false
        default: 'pplink_s21'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt update && sudo apt install -y build-essential git libncurses-dev gawk flex bison

      - name: Clone source
        run: git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git openwrt

      - name: Copy DTS and .mk
        run: |
          mkdir -p openwrt/target/linux/mediatek/dts
          mkdir -p openwrt/target/linux/mediatek/image
          cp ${{ github.workspace }}/target/linux/mediatek/dts/mt7981-pplink-s21.dts openwrt/target/linux/mediatek/dts/
          cp ${{ github.workspace }}/target/linux/mediatek/image/mt7981.mk openwrt/target/linux/mediatek/image/

      - name: Configure
        run: |
          cd openwrt
          # 使用项目默认配置作为基础
          cp defconfig/mt7981-ax3000.config .config
          # 直接启用你的设备（写死，不依赖 scripts/config）
          echo 'CONFIG_TARGET_mediatek_mt7981_DEVICE_pplink_s21=y' >> .config
          # 非交互式更新依赖
          yes '' | make oldconfig

      - name: Download
        run: cd openwrt && make download -j8

      - name: Build
        run: cd openwrt && make -j$(nproc) V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pplink-s21-firmware
          path: openwrt/bin/targets/mediatek/mt7981/*.bin
