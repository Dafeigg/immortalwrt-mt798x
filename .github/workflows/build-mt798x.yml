name: Build mt798x

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device
        required: true
        default: 'pplink_s21'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt update && sudo apt install -y build-essential git libncurses-dev gawk flex bison
      - name: Clone source
        run: git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git openwrt
      - name: Overlay DTS
        run: |
          cp ${{ github.workspace }}/target/linux/mediatek/dts/mt7981-pplink-s21.dts \
             openwrt/target/linux/mediatek/dts/
          cp ${{ github.workspace }}/target/linux/mediatek/image/mt7981.mk \
             openwrt/target/linux/mediatek/image/
      - name: Configure
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_pplink_s21=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
          yes '' | make oldconfig
      - name: Download
        run: cd openwrt && make download -j8
      - name: Build
        run: cd openwrt && make -j$(nproc)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt/bin/targets/mediatek/mt7981/*.bin
