name: Build mt798x

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build'
        required: true
        default: 'pplink_s21'
        type: choice
        options:
          - jcg_q30
          - cmcc_rax3000m
          - glinet_gl-mt3000
          - h3c_nx30pro
          - livinet_zr-3020
          - ikuai_q3000
          - xiaomi_mi-router-wr30u
          - xiaomi_mi-router-ax3000t
          - cetron_ct3003
          - abt_asr3000
          - cmcc_a10
          - nradio_wt9103
          - nradio_wt9103_512m
          - pplink_s21
      clean:
        description: 'Clean build (remove staging_dir/toolchain*)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget

      - name: Clone source code and copy custom files
        run: |
          git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git immortalwrt
          cd immortalwrt
          
          # 1. 将你的 DTS 文件复制到内核源码目录的正确位置
          cp ${{ github.workspace }}/target/linux/mediatek/dts/mt7981-pplink-s21.dts \
             target/linux/mediatek/dts/
          
          # 2. 将包含设备定义的 Makefile 复制到正确位置
          cp ${{ github.workspace }}/target/linux/mediatek/image/mt7981.mk \
             target/linux/mediatek/image/
          
          # 3. 创建一个更完整的符号链接，确保编译系统能找到 DTS 文件（关键步骤）
          mkdir -p target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek
          ln -sf $(pwd)/target/linux/mediatek/dts/mt7981-pplink-s21.dts \
                 target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/
          
          # 4. 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        run: |
          cd immortalwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_${{ github.event.inputs.device }}=y" >> .config
          make defconfig

      - name: Download packages
        run: |
          cd immortalwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd immortalwrt
          if [ "${{ github.event.inputs.clean }}" = "true" ]; then
            make clean
          fi
          # 执行彻底清理，排除之前错误的编译产物
          make dirclean
          # 重新生成配置
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_${{ github.event.inputs.device }}=y" >> .config
          make defconfig
          # 开始编译
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device }}-firmware
          path: immortalwrt/bin/targets/mediatek/mt7981/*.bin
