name: Build mt798x

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build'
        required: true
        default: 'pplink_s21'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget

      - name: Clone source code
        run: |
          git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Overlay custom DTS and device definition
        run: |
          cd openwrt
          # 创建必要的目录（关键修复）
          mkdir -p target/linux/mediatek/dts
          mkdir -p target/linux/mediatek/image
          # 复制你的 DTS 和设备定义文件
          cp ${{ github.workspace }}/target/linux/mediatek/dts/mt7981-pplink-s21.dts target/linux/mediatek/dts/
          cp ${{ github.workspace }}/target/linux/mediatek/image/mt7981.mk target/linux/mediatek/image/

      - name: Configure firmware
        run: |
          cd openwrt
          export TERM=linux
          # 使用项目默认配置作为基础
          cp defconfig/mt7981-ax3000.config .config
          # 启用你的设备
          ./scripts/config --enable CONFIG_TARGET_mediatek_mt7981_DEVICE_pplink_s21
          # 非交互式生成最终配置
          yes "" | make oldconfig

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device }}-firmware
          path: openwrt/bin/targets/mediatek/mt7981/*.bin
